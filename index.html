<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="Arthur Conde Salazar’s graphics portfolio"
        />
        <title>Arthur Conde Salazar</title>
        <link rel="icon" href="assets/favicon-32x32.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css?v=4" />

    <body>
        <div id="app"></div>
        <dialog id="lightbox" aria-label="Media viewer">
            <button id="close" aria-label="Close">×</button>
            <figure>
                <div id="lightbox-media"></div>
                <figcaption class="label"></figcaption>
                <nav>
                    <button data-move="-1" aria-label="Previous">←</button
                    ><button data-move="1" aria-label="Next">→</button>
                </nav>
            </figure>
        </dialog>
        <script src="data.js"></script>
        <script src="main.js?v=3"></script>
    </body>
</html>
